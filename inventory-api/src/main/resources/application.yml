spring:
  application:
    name: inventory-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/inventory_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

app:
  bootstrap:
    # Used ONLY on first run (when the app_user table is empty) to create
    # the initial admin account. Override before first run in production.
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@inventory.local}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:Admin@12345}
  jwt:
    # IMPORTANT: override JWT_SECRET in production via environment variable.
    # Generate one with: openssl rand -base64 64
    secret: ${JWT_SECRET:change-this-development-only-secret-key-please-replace-me-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}

logging:
  level:
    com.inventory.api: INFO
    org.springframework.security: WARN
